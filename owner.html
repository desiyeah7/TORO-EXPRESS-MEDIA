<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camera Test</title>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
video { width:70%; max-width:600px; border:2px solid #4caf50; border-radius:10px; margin-top:15px; }
button { padding:10px 20px; margin:10px; font-size:16px; }
#indicator { width:15px; height:15px; background:gray; border-radius:50%; display:inline-block; }
</style>
</head>
<body>

<h2>Camera & Microphone Test</h2>

<button onclick="start()">Start Camera</button>
<button onclick="stop()">Stop Camera</button>

<p>Live: <span id="indicator"></span></p>

<video id="preview" autoplay playsinline></video>

<script>
let stream = null;

function start(){
  navigator.mediaDevices.getUserMedia({ video:true, audio:true })
  .then(s=>{
    stream = s;
    preview.srcObject = s;
    indicator.style.background = "red";
  })
  .catch(err => alert(err.message));
}

function stop(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
    preview.srcObject = null;
    indicator.style.background = "gray";
  }
}
</script>

</body>
</html>
